name: Publish Roblox game

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'roblox/src/**'
      - 'roblox/tests/**'
      - 'roblox/build_place.py'
      - 'roblox/build_day.py'
      - 'roblox/build_details.py'
      - 'roblox/check_project.py'
      - 'roblox/publish_place.py'
      - 'roblox/Opening.rbxlx'
      - '.github/workflows/roblox-publish.yml'

permissions:
  contents: read

concurrency:
  group: roblox-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROBLOX_UNIVERSE_ID: '9448778605'
      ROBLOX_PLACE_ID: '106131587175306'
    defaults:
      run:
        working-directory: roblox
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Lua checker
        run: sudo apt-get update -qq && sudo apt-get install -y liblua5.4-0
      - name: Build the complete Roblox place
        run: python3 build_place.py
      - name: Validate geometry and story progression
        run: python3 check_project.py
      - name: Check the publisher
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check publishing connection
        id: connection
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          ready = bool(os.environ.get("ROBLOX_API_KEY", "").strip())
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"ready={str(ready).lower()}\n")
          if not ready:
              print("Build passed. Add ROBLOX_API_KEY to repository Actions secrets to connect publishing.")
          PY
      - name: Publish to the selected experience
        if: steps.connection.outputs.ready == 'true'
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: python3 publish_place.py
